name: rugdraiger_player
description: "Rugdraiger Player - High Performance Lossless Music Player"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Audio Engine
  just_audio: ^0.9.40
  just_audio_background: ^0.0.1-beta.11
  audio_service: ^0.18.15

  # Media Scanner & Metadata
  on_audio_query: ^2.9.0

  # Permissions
  permission_handler: ^11.3.1

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Database & Storage
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.3

  # Navigation
  go_router: ^14.6.2

  # UI Utilities
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  palette_generator: ^0.3.3+3
  animations: ^2.0.11
  flutter_animate: ^4.5.0

  # Icons & Fonts
  cupertino_icons: ^1.0.8
  iconsax: ^0.0.8

  # Utilities
  rxdart: ^0.28.0
  file_picker: ^8.1.4
  audio_session: ^0.1.25
  get_it: ^8.0.3
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/app_icon.png
