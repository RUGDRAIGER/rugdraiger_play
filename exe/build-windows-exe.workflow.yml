# Copia este archivo a .github/workflows/ en GitHub
# (requiere token con permiso "workflow" al hacer push)
#
# Luego: Actions > Build Windows EXE > Run workflow
# Descarga el artefacto RugdraigerPlay-win64.zip

name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: rugdraiger_player
      - run: flutter build windows --release
        working-directory: rugdraiger_player
      - name: Package
        shell: pwsh
        run: |
          $dst = "exe/RugdraigerPlay"
          Remove-Item $dst -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item rugdraiger_player/build/windows/x64/runner/Release $dst -Recurse
          Compress-Archive -Path $dst -DestinationPath exe/RugdraigerPlay-win64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: RugdraigerPlay-win64
          path: exe/RugdraigerPlay-win64.zip
