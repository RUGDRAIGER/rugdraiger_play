name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Win_install/**'
      - 'exe/desktop-shell/**'
      - 'web/**'
      - '.github/workflows/build-windows-installer.yml'

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            exe/desktop-shell/package-lock.json

      - name: Build NSIS installer
        shell: pwsh
        run: ./Win_install/build-installer.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: RugdraigerPlay-Setup
          path: |
            web/public/Win_install/RugdraigerPlay-Setup.exe
            Win_install/dist/
